site:
    name: Utopia Images
    description: 又一个Utopia Images自部署图床
    base_url: http://localhost:8080
    locale: zh-CN
server:
    host: 0.0.0.0
    port: 8080
    base_url: http://localhost:8080
    mode: release
database:
    driver: sqlite
    dsn: data/utopiaimages.db
storage:
    driver: local
    local:
        base_path: storage
cache:
    dir: cache
    max_size_mb: 5120
security:
    secret_key: default-insecure-secret-key-change-me
    session_timeout_days: 7
    remember_me_days: 30
    max_login_attempts: 5
    lockout_minutes: 15
    captcha:
        provider: altcha
        turnstile_site_key: ""
        turnstile_secret_key: ""
policy:
    max_single_file_size: 52428800
    max_process_image_size: 5242880
smtp:
    enabled: false
    host: ""
    port: 465
    from: ""
    from_name: Utopia Images
    user: ""
    password: ""
    encryption: ssl
logging:
    level: INFO
    dir: logs
    max_size_mb: 20
    max_backups: 10
    max_age_days: 30
    compress: true
    permanent_level: error
