name: Release
run-name: Release ${{ github.ref_name }} by @${{ github.actor }}

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Custom Tag (e.g. v1.0.0)'
        required: false
        default: ''
      push:
        description: 'Push Docker image and GitHub Release'
        required: true
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version:
    name: Resolve Version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
      note_file: ${{ steps.resolve.outputs.note_file }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve Version and Note
        id: resolve
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [ -n "${{ inputs.tag_name }}" ]; then
            TAG="${{ inputs.tag_name }}"
          fi
          cleanVersion="${TAG#v}"
          cleanVersion="${cleanVersion%+*}"

          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${cleanVersion}" >> "$GITHUB_OUTPUT"

          notePathWithV="assets/documentation/release_note/${TAG}.md"
          notePathWithoutV="assets/documentation/release_note/${cleanVersion}.md"

          if [ -f "$notePathWithV" ]; then
            echo "note_file=$notePathWithV" >> "$GITHUB_OUTPUT"
          elif [ -f "$notePathWithoutV" ]; then
            echo "note_file=$notePathWithoutV" >> "$GITHUB_OUTPUT"
          else
            echo "note_file=" >> "$GITHUB_OUTPUT"
          fi

  build-binaries:
    name: Build Multi-Platform Binaries
    needs: version
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.version.outputs.tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Frontend
        run: |
          cd web
          npm install
          npm run build
          cd ..

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Build Multi-Platform Binaries
        run: |
          mkdir -p dist_release

          PLATFORMS=(
            "linux/amd64"
            "linux/arm64"
            "darwin/amd64"
            "darwin/arm64"
            "windows/amd64"
            "windows/arm64"
          )

          for PLATFORM in "${PLATFORMS[@]}"; do
            GOOS="${PLATFORM%/*}"
            GOARCH="${PLATFORM#*/}"
            BIN_NAME="utopia_images"
            if [ "$GOOS" = "windows" ]; then
              BIN_NAME="utopia_images.exe"
            fi

            TARGET_DIR="utopia_images_${TAG}_${GOOS}_${GOARCH}"
            mkdir -p "${TARGET_DIR}/data/config"
            cp data/config/config.example.yaml "${TARGET_DIR}/data/config/config.yaml"

            CGO_ENABLED=0 GOOS="${GOOS}" GOARCH="${GOARCH}" go build \
              -ldflags="-s -w -X github.com/UtopiaXC/UtopiaImages/internal/config.Version=${TAG}" \
              -o "${TARGET_DIR}/${BIN_NAME}" ./cmd/utopia_images/main.go

            if [ "$GOOS" = "windows" ]; then
              zip -r "dist_release/${TARGET_DIR}.zip" "${TARGET_DIR}"
            else
              tar -czf "dist_release/${TARGET_DIR}.tar.gz" "${TARGET_DIR}"
            fi
            rm -rf "${TARGET_DIR}"
          done

      - name: Upload Binaries Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-binaries
          path: dist_release/*
          if-no-files-found: error

  build-and-push-docker:
    name: Build and Push Multi-Arch Docker Image
    needs: [version, build-binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine Docker Image Name
        id: image-name
        run: |
          NAMESPACE="${{ secrets.DOCKERHUB_USERNAME }}"
          echo "image_name=${NAMESPACE}/utopia_images" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: 'linux/amd64,linux/arm64'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || github.event.inputs.push != false)
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image-name.outputs.image_name }}
          flavor: |
            latest=auto
          tags: |
            type=raw,value=latest
            type=raw,value=${{ needs.version.outputs.tag }}

      - name: Build and push multi-architecture image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || github.event.inputs.push != false) }}
          build-args: |
            APP_VERSION=${{ needs.version.outputs.tag }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish-release:
    name: Create GitHub Release
    needs: [version, build-binaries, build-and-push-docker]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.event.inputs.push != false)
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve Release Note File
        id: release_note
        shell: bash
        run: |
          NOTE_FILE="${{ needs.version.outputs.note_file }}"
          if [ -n "$NOTE_FILE" ] && [ -f "$NOTE_FILE" ]; then
            echo "note_path=$NOTE_FILE" >> "$GITHUB_OUTPUT"
          else
            touch release_note_empty.md
            echo "note_path=release_note_empty.md" >> "$GITHUB_OUTPUT"
          fi

      - name: Download Built Binaries
        uses: actions/download-artifact@v4
        with:
          name: release-binaries
          path: dist_release

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: UtopiaImages ${{ needs.version.outputs.tag }}
          tag_name: ${{ needs.version.outputs.tag }}
          body_path: ${{ steps.release_note.outputs.note_path }}
          files: dist_release/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
