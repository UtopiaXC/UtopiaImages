# UtopiaImages 配置文件示例

server:
  host: "0.0.0.0"
  port: 2983
  base_url: "http://localhost:2983" # 对外访问域名
  mode: "debug" # debug | release

# 数据库配置（支持 sqlite / postgres）
database:
  driver: "sqlite" # sqlite 或 postgres
  dsn: "data/db/utopia_images.db" # postgres: "postgres://user:password@localhost:5432/utopia_images?sslmode=disable"

# 存储后端
storage:
  driver: "local"
  local:
    base_path: "data/storage"

# 缓存配置
cache:
  dir: "cache"
  max_size_mb: 5120 # 缓存容量上限(MB)，0表示无上限
  ttl_days: 0 # 缓存保留时间(天)，0表示无上限（永久保存）

# 日志配置
logging:
  level: "info" # debug | info | warn | error
  dir: "logs"
  max_size_mb: 20
  max_backups: 10
  max_age_days: 30
  compress: true

# 安全与认证
security:
  secret_key: "CHANGE_ME_TO_A_SECURE_RANDOM_STRING"
  session_timeout_days: 7
  remember_me_days: 30
  max_login_attempts: 5
  lockout_minutes: 15
  captcha:
    provider: "altcha" # altcha (内置/离线可用) / turnstile / none
    turnstile_site_key: ""
    turnstile_secret_key: ""

# 系统默认策略
policy:
  max_single_file_size: 52428800 # 50MB
  max_process_image_size: 5242880 # 5MB（超过此大小的图片若无强制水印则不执行实时缩放）
