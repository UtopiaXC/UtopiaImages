services:
  utopiaimages:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: utopiaimages
    restart: always
    ports:
      - "8080:8080"
    volumes:
      - ../config:/app/config
      - ../data:/app/data
      - ../storage:/app/storage
      - ../cache:/app/cache
    environment:
      - TZ=Asia/Shanghai
      - UIMG_SERVER_PORT=8080
      - UIMG_SERVER_MODE=debug
