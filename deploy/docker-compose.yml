services:
  utopia_images:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: utopia_images
    restart: always
    ports:
      - "2983:2983"
    volumes:
      - ../data:/app/data
    environment:
      - TZ=Asia/Shanghai
      - UIMG_SERVER_PORT=2983
      - UIMG_SERVER_MODE=debug
